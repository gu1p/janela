[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "janela"
version = "0.0.18"
description = "A simple tool to automate window management"
readme = "README.md"
requires-python = ">=3.8,<4.0"
license = { file = "LICENSE" }
authors = [{ name = "Gustavo", email = "github.dxabr@aleeas.com" }]
dependencies = [
    "python-xlib>=0.33,<1.0; sys_platform == \"linux\"",
    "pyobjc-core>=10.0,<11.0; sys_platform == \"darwin\"",
    "pyobjc-framework-Cocoa>=10.0,<11.0; sys_platform == \"darwin\"",
    "pyobjc-framework-ApplicationServices>=10.0,<11.0; sys_platform == \"darwin\"",
    "pyobjc-framework-Quartz>=10.0,<11.0; sys_platform == \"darwin\"",
]

[tool.hatch.build.targets.wheel]
packages = ["janela"]

[dependency-groups]
dev = [
    "black>=24.8.0,<25.0.0",
    "pylint>=2.17,<4.0",
]
